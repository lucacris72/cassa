{% extends "base.html" %}
{% block title %}Prodotti{% endblock %}
{% block content %}
  <section class="two-column">
    <form method="post" action="/products" class="panel stack">
      <h1>Nuovo prodotto</h1>
      <label>Nome <input name="name" required></label>
      <label>Prezzo <input name="price" inputmode="decimal" placeholder="6.00" required></label>
      <label>
        Categoria
        <select name="category_id" required>
          {% for category in categories %}
            <option value="{{ category.id }}">{{ category.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Ordine <input name="sort_order" type="number" value="0"></label>
      <label>Descrizione <textarea name="description" rows="3"></textarea></label>
      <button class="button primary" type="submit">Salva</button>
    </form>

    <section class="panel product-admin">
      <div class="section-header">
        <h1>Prodotti</h1>
        <form method="get" action="/products" class="inline-form">
          <select name="category_id">
            <option value="0">Tutte le categorie</option>
            {% for category in categories %}
              <option value="{{ category.id }}" {% if selected_category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
            {% endfor %}
          </select>
          <select name="show">
            <option value="all" {% if selected_show == "all" %}selected{% endif %}>Tutti</option>
            <option value="active" {% if selected_show == "active" %}selected{% endif %}>Solo attivi</option>
            <option value="inactive" {% if selected_show == "inactive" %}selected{% endif %}>Solo disattivi</option>
          </select>
          <button class="button" type="submit">Filtra</button>
        </form>
      </div>

      {% for group in grouped_products %}
        <section class="product-group">
          <h2>{{ group.name }}</h2>
          <div class="product-edit-list">
            {% for product in group.products %}
              <form id="product-edit-{{ product.id }}" method="post" action="/products/{{ product.id }}/edit"></form>
              <article class="product-edit-row {% if not product.active %}inactive{% endif %}">
                <input form="product-edit-{{ product.id }}" type="hidden" name="return_to" value="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}">
                <input form="product-edit-{{ product.id }}" type="hidden" name="active" value="{{ 'true' if product.active else 'false' }}">

                <div class="product-main-fields">
                  <label class="product-name-field">
                    Nome
                    <input form="product-edit-{{ product.id }}" name="name" value="{{ product.name }}" required>
                  </label>
                  <label class="product-price-field">
                    Prezzo
                    <input form="product-edit-{{ product.id }}" name="price" inputmode="decimal" value="{{ '%.2f' % (product.price_cents / 100) }}" required>
                  </label>
                </div>

                <div class="product-meta-fields">
                  <label>
                    Categoria
                    <select form="product-edit-{{ product.id }}" name="category_id" required>
                      {% for category in categories %}
                        <option value="{{ category.id }}" {% if category.id == product.category_id %}selected{% endif %}>{{ category.name }}</option>
                      {% endfor %}
                    </select>
                  </label>
                  <label class="product-order-field">
                    Ordine
                    <input form="product-edit-{{ product.id }}" name="sort_order" type="number" value="{{ product.sort_order }}">
                  </label>
                  <label class="product-description-field">
                    Descrizione
                    <input form="product-edit-{{ product.id }}" name="description" value="{{ product.description or '' }}">
                  </label>
                </div>

                <div class="product-row-actions">
                  <button form="product-edit-{{ product.id }}" class="button primary small" type="submit">Salva</button>
                  <form method="post" action="/products/{{ product.id }}/toggle-active">
                    <input type="hidden" name="return_to" value="{{ request.url.path }}{% if request.url.query %}?{{ request.url.query }}{% endif %}">
                    <button class="status-toggle {{ 'on' if product.active else 'off' }}" type="submit">
                      {{ "Attivo" if product.active else "Disattivo" }}
                    </button>
                  </form>
                  <a class="button small" href="/products/{{ product.id }}/edit">Scheda</a>
                </div>
              </article>
            {% endfor %}
          </div>
        </section>
      {% else %}
        <p>Nessun prodotto trovato.</p>
      {% endfor %}
    </section>
  </section>
{% endblock %}
