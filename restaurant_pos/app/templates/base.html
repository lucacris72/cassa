<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cassa{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/app.css') }}">
  </head>
  <body>
    {% if user %}
      <header class="topbar">
        <a class="brand" href="/">Cassa</a>
        <nav class="nav">
          <a href="/">Cassa</a>
          <a href="/reservations">Prenotazioni</a>
          <a href="/orders">Ordini</a>
          <a href="/closures">Chiusure</a>
          <a href="/mobile">Mobile</a>
          {% if user.role == "admin" %}
            <a href="/products">Prodotti</a>
            <a href="/categories">Categorie</a>
            <a href="/printers">Stampanti</a>
          {% endif %}
        </nav>
        <form method="post" action="/logout">
          <button class="button ghost" type="submit">{{ user.name }} · Esci</button>
        </form>
      </header>
    {% endif %}

    <main class="{% block main_class %}page{% endblock %}">
      {% if flashes %}
        <section class="flashes">
          {% for flash in flashes %}
            <div class="flash {{ flash.category }}">{{ flash.message }}</div>
          {% endfor %}
        </section>
      {% endif %}
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
